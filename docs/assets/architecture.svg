<svg xmlns="http://www.w3.org/2000/svg" style="background:#000" viewBox="0 0 1000 560" width="100%" role="img" aria-label="Clients connect to one Worker serving &lt;domain&gt;, mcp.&lt;domain&gt; and usercontent.&lt;domain&gt;. The Worker routes to each person's Base Durable Object, which holds raw notes, the change feed, approvals, a jobs outbox, FTS5, vectors and graph edges, and keeps live WebSockets. A DO alarm dispatches jobs to a Queue and Workflows, which call Workers AI and install results back into the DO only if the note revision still matches. Neon via Hyperdrive holds accounts and the registry; R2 holds files.">
  <defs><marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a3a3a3"/></marker></defs>
  <text x="10" y="18" fill="#8a8a8a" font-size="11">CLIENTS</text>
  <g font-size="12" fill="#fff">
    <rect x="10" y="26" width="180" height="46" fill="#111" stroke="#444"/><text x="22" y="46">Site + viewer</text><text x="22" y="62" fill="#a3a3a3" font-size="11">browser, phone (PWA)</text>
    <rect x="210" y="26" width="180" height="46" fill="#111" stroke="#444"/><text x="222" y="46">brainiac CLI + daemon</text><text x="222" y="62" fill="#a3a3a3" font-size="11">local copy or thin</text>
    <rect x="410" y="26" width="180" height="46" fill="#111" stroke="#444"/><text x="422" y="46">Agents (MCP)</text><text x="422" y="62" fill="#a3a3a3" font-size="11">remote OAuth / stdio</text>
    <rect x="610" y="26" width="180" height="46" fill="#111" stroke="#444"/><text x="622" y="46">Browser extension</text><text x="622" y="62" fill="#a3a3a3" font-size="11">fill, save link</text>
    <rect x="810" y="26" width="180" height="46" fill="#111" stroke="#444"/><text x="822" y="46">Email-in</text><text x="822" y="62" fill="#a3a3a3" font-size="11">forwarded mail → inbox</text>
  </g>
  <g stroke="#a3a3a3" fill="none" marker-end="url(#ar3)">
    <line x1="100" y1="72" x2="160" y2="116"/><line x1="300" y1="72" x2="330" y2="116"/><line x1="500" y1="72" x2="500" y2="116"/><line x1="700" y1="72" x2="660" y2="116"/><line x1="900" y1="72" x2="820" y2="116"/>
  </g>
  <rect x="10" y="118" width="980" height="62" fill="#111" stroke="#ffb000"/>
  <text x="22" y="140" fill="#fff" font-size="13">One Worker  ·  &lt;domain&gt;  ·  mcp.&lt;domain&gt;  ·  usercontent.&lt;domain&gt; (sandboxed, no cookies)</text>
  <text x="22" y="160" fill="#a3a3a3" font-size="11">TanStack Start UI · Better Auth sessions · /v1 API · MCP (OAuth) · WebSocket upgrade · uploads · authorized file reads · queue consumer · Workflows</text>
  <text x="22" y="174" fill="#a3a3a3" font-size="11">base id always comes from the session or token (tokens carry it), never from the URL</text>
  <g stroke="#a3a3a3" fill="none" marker-end="url(#ar3)">
    <line x1="260" y1="180" x2="260" y2="226"/><line x1="660" y1="180" x2="660" y2="226"/><line x1="880" y1="180" x2="880" y2="226"/>
  </g>
  <rect x="10" y="228" width="560" height="190" fill="#1a1400" stroke="#ffb000"/>
  <text x="24" y="250" fill="#ffb000" font-size="14">Base Durable Object  ×  one per person</text>
  <g font-size="11" fill="#e6e6e6">
    <text x="24" y="272">notes (raw markdown + parsed fields) · revisions · changes (seq) · client high-water marks</text>
    <text x="24" y="290">proposals (incl. held) · approvals · questions · checks · audit · tokens (hashed)</text>
    <text x="24" y="308">jobs outbox · chunks + FTS5 (per privacy class) · int8 vectors · edges</text>
    <text x="24" y="326">secrets (ciphertext) · schema (versioned) · hibernating WebSockets</text>
    <text x="24" y="350" fill="#ffb000">write discipline: read rev, validate, write, enqueue jobs, commit.</text>
    <text x="24" y="366" fill="#ffb000">No network call inside a mutation; models and embeddings run after commit.</text>
    <text x="24" y="390" fill="#a3a3a3">same schema and queries as the CLI's SQLite (packages/base) · alarms for timers</text>
    <text x="24" y="406" fill="#a3a3a3">point-in-time recovery 30 days (disaster only)</text>
  </g>
  <rect x="590" y="228" width="190" height="84" fill="#111" stroke="#444"/><text x="602" y="248" fill="#fff" font-size="12">Neon (Hyperdrive)</text><text x="602" y="266" fill="#a3a3a3" font-size="11">users, base registry,</text><text x="602" y="280" fill="#a3a3a3" font-size="11">billing state, OAuth</text><text x="602" y="294" fill="#a3a3a3" font-size="11">clients, usage rollups</text>
  <rect x="800" y="228" width="190" height="84" fill="#111" stroke="#444"/><text x="812" y="248" fill="#fff" font-size="12">R2</text><text x="812" y="266" fill="#a3a3a3" font-size="11">blobs/{base}/{sha256}</text><text x="812" y="280" fill="#a3a3a3" font-size="11">derived/ (thumbs, PDFs)</text><text x="812" y="294" fill="#a3a3a3" font-size="11">sensitive: envelope-encrypted</text>
  <rect x="590" y="328" width="400" height="90" fill="#111" stroke="#444"/><text x="602" y="348" fill="#fff" font-size="12">Queue + Workflows (durable steps, retries)</text><text x="602" y="366" fill="#a3a3a3" font-size="11">IngestFile · FileInbox · Reindex · RenderPDF · Connector sync</text><text x="602" y="382" fill="#a3a3a3" font-size="11">results installed only if the note rev still matches;</text><text x="602" y="398" fill="#a3a3a3" font-size="11">otherwise dropped and re-run for the new rev</text>
  <line x1="572" y1="372" x2="588" y2="372" stroke="#a3a3a3" marker-end="url(#ar3)"/>
  <line x1="588" y1="400" x2="572" y2="400" stroke="#a3a3a3" marker-end="url(#ar3)"/>
  <text x="10" y="450" fill="#8a8a8a" font-size="11">SERVICES</text>
  <g font-size="11" fill="#fff">
    <rect x="10" y="458" width="236" height="52" fill="#111" stroke="#444"/><text x="22" y="478">Workers AI</text><text x="22" y="496" fill="#a3a3a3">toMarkdown · bge-m3 embeddings</text>
    <rect x="258" y="458" width="236" height="52" fill="#111" stroke="#444"/><text x="270" y="478">Better Auth (in the Worker)</text><text x="270" y="496" fill="#a3a3a3">passkeys · MCP OAuth</text>
    <rect x="506" y="458" width="236" height="52" fill="#111" stroke="#444"/><text x="518" y="478">Browser Rendering · Images</text><text x="518" y="496" fill="#a3a3a3">link snapshots · thumbnails</text>
    <rect x="754" y="458" width="236" height="52" fill="#111" stroke="#444"/><text x="766" y="478">Polar · Resend · treg</text><text x="766" y="496" fill="#a3a3a3">billing · email · paid data</text>
  </g>
  <text x="10" y="540" fill="#8a8a8a" font-size="11">One alchemy.run.ts per stage (dev, pr-123, prod); each stage is a Neon branch, prod in its own project.</text>
</svg>