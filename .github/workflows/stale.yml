name: stale

# Closes issues that sat 14 days with the needs-info label (added by triage) and no reply. Any comment or
# edit removes the label and stops the clock. Nothing else is ever marked stale.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  close:
    name: Close unanswered needs-info issues
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/stale@v11
        with:
          only-issue-labels: needs-info
          stale-issue-label: needs-info
          days-before-issue-stale: -1
          days-before-issue-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-issue-stale-when-updated: true
          close-issue-reason: not_planned
          close-issue-message: >-
            Closing: no reply in 14 days after we asked for more information.
            Comment with what's missing and we'll reopen it.
