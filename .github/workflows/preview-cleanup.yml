name: preview-cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Tears down the pr-<n> stage ci.yml deployed, Neon branch included. Same group as the deploy, so they
  # never run at once.
  destroy:
    name: Destroy preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4
      - run: doppler run -- alchemy destroy --stage pr-${{ github.event.pull_request.number }} --yes --no-input
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
      # Only edits ci.yml's preview comment; a PR that never deployed has none to edit.
      - run: |
          gh pr comment "$PR" --edit-last --body "### Preview

          Deleted when this PR closed." || true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
