name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # vp comes from the pinned vite-plus devDependency, so CI and laptops run the same toolchain.
      - name: Format and lint
        run: pnpm exec vp check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm exec vp test run
      - name: Unused files, exports and dependencies
        run: pnpm exec knip
