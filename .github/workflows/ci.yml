name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs queue so a prod deploy is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runners: checks run on GitHub's own runners, free and unlimited on a public repo. Deploys are the
  # slowest job of every run, so they get Blacksmith (co-located cache) on 2 vCPU ARM, its cheapest draw on
  # the 3,000 free minutes (0.625x). If those run out, set the DEPLOY_RUNNER repo variable to ubuntu-24.04.
  # Every job stops at 5 minutes, so the longest chain (a check, then the prod deploy) ends under 10.
  # One job per check, all in parallel, so the slowest check sets the wall time and a failure names itself.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format and lint
            run: vp check
          - name: Typecheck
            run: vp run typecheck
          - name: Test
            run: vp test run
          - name: Unused code
            run: knip
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: ${{ matrix.run }}

  # A pr-<n> stage per PR: its own Worker, R2 bucket, queue, Neon branch and Hyperdrive. It runs beside the
  # checks rather than after them, so the preview is up as soon as possible.
  # Fork PRs get no secrets, so only same-repo PRs deploy. preview-cleanup.yml destroys it on close.
  preview:
    name: Deploy preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.DEPLOY_RUNNER || 'blacksmith-2vcpu-ubuntu-2404-arm' }}
    timeout-minutes: 5
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/deploy
        with:
          stage: pr-${{ github.event.pull_request.number }}
          doppler-token: ${{ secrets.DOPPLER_TOKEN_DEV }}

  # Prod deploys only from here, after every check passes. The prd token lives in the production environment,
  # which only main can use.
  prod:
    name: Deploy prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ${{ vars.DEPLOY_RUNNER || 'blacksmith-2vcpu-ubuntu-2404-arm' }}
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/deploy
        with:
          stage: prod
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
