name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs queue so a prod deploy is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runners: GitHub's own, free and unlimited on a public repo. Blacksmith (installed on the org, 3,000 free
  # minutes) was measured on the deploy and lost: 11s queue vs 3s, same setup and deploy time, since these
  # jobs wait on the network, not the CPU. Set the RUNNER repo variable (e.g. blacksmith-2vcpu-ubuntu-2404)
  # to move every job there if a CPU-heavy job ever lands.
  # Every job on the way to prod stops at 5 minutes, so the longest chain (a check, then the prod deploy) ends under 10.
  # One job per check, all in parallel, so the slowest check sets the wall time and a failure names itself.
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format and lint
            run: vp check
          - name: Typecheck
            run: vp run typecheck
          - name: Test
            run: vp test run
          - name: Unused code
            run: knip
          # The site's component tests in headless Chromium (apps/web *.browser.test.tsx).
          - name: Browser tests
            run: playwright install --with-deps --only-shell chromium && vp run test:browser
          # Paid eval runs stay local; CI proves each eval still loads its world and cases (graders run in Test).
          # Retrieval calls no model offline, so CI runs it whole, keyword-only.
          - name: Eval dry runs
            run: vp run eval:answers --out evals/runs/ci --dry-run && vp run eval:drafts --out evals/runs/ci --dry-run && vp run eval:filing --out evals/runs/ci --dry-run && vp run eval:photos --out evals/runs/ci --dry-run && vp run eval:structure --out evals/runs/ci --dry-run && vp run eval:mcp-tool-use --out evals/runs/ci --dry-run && vp run eval:retrieval --out evals/runs/ci/retrieval
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: ${{ matrix.run }}

  # p95 of the MCP paths in workerd, on the fixture and a 20k-chunk record (docs/operations/quality-bar.md). PRs
  # only, and never between main and the prod deploy: GitHub's runners differ by half again in speed from run to run,
  # so main is measured first on the same runner, and a row fails only when it is over its target and also clearly
  # slower than main there (apps/worker/bench/verdict.ts).
  bench:
    name: Bench
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup
      # The checkout is the PR merged onto main, so its first parent is main as the PR would land on it.
      - name: Bench main on this runner
        run: |
          set -o pipefail
          git worktree add "$RUNNER_TEMP/main" HEAD^1
          cd "$RUNNER_TEMP/main"
          # Main's own verdict only warns: this job judges the PR, but main drifting over a target should show.
          if [ -f apps/worker/bench/bench.ts ] && vp i --frozen-lockfile; then
            node apps/worker/bench/bench.ts | tee "$RUNNER_TEMP/main.txt" ||
              echo "::warning::main's own bench failed or went over a target on this runner."
          fi
          grep -q " ms " "$RUNNER_TEMP/main.txt" 2>/dev/null ||
            echo "::warning::main wasn't measured; this PR is judged by the targets alone."
      - name: Bench this PR
        run: |
          if grep -q " ms " "$RUNNER_TEMP/main.txt" 2>/dev/null; then
            node apps/worker/bench/bench.ts --baseline "$RUNNER_TEMP/main.txt"
          else
            node apps/worker/bench/bench.ts
          fi

  # The daemon on Windows, where the swap is ReplaceFileW and the login service a scheduled task: its
  # real-filesystem cases and unit tests, on NTFS.
  windows:
    name: Daemon on Windows
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: vp test run apps/cli
        shell: bash
      # The compiled binary installs its login task: Task Scheduler takes the file and runs the binary alone with
      # `daemon run` (never its embedded script path), and uninstall removes it.
      - name: Install the daemon as a scheduled task
        shell: pwsh
        working-directory: apps/cli
        run: |
          pnpm exec bun build --compile src/main.ts --outfile dist/brainiac.exe
          ./dist/brainiac.exe daemon install --vault "$env:RUNNER_TEMP\vault" --server http://127.0.0.1:9
          if ($LASTEXITCODE) { exit 1 }
          $task = schtasks /Query /TN "Brainiac daemon" /XML | Out-String
          $task
          if ($task -notmatch '<Arguments>(&quot;|")daemon(&quot;|") (&quot;|")run(&quot;|")</Arguments>') { exit 1 }
          ./dist/brainiac.exe daemon uninstall
          schtasks /Query /TN "Brainiac daemon" 2>$null
          if (-not $LASTEXITCODE) { exit 1 }
          exit 0

  # Fails a PR that adds or bumps a dependency to a version with a known moderate-or-worse vulnerability.
  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: moderate
          # Nearly everything here is a devDependency that CI runs (alchemy, vite-plus), so all scopes count.
          fail-on-scopes: runtime, development, unknown

  # zizmor lints the workflows for injection, token leaks and unpinned actions (.github/zizmor.yml).
  workflows:
    name: Workflow security
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.31.1 --format github --min-severity low .github
        env:
          GH_TOKEN: ${{ github.token }}

  # A pr-<n> stage per PR: its own Worker, R2 bucket, queue, Neon branch and Hyperdrive. It runs beside the
  # checks rather than after them, so the preview is up as soon as possible.
  # Fork PRs get no secrets, so only same-repo PRs deploy. preview-cleanup.yml destroys it on close.
  # One comment on the PR carries the links, edited on every deploy so it names the commit the preview runs.
  preview:
    name: Deploy preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: deploy
        uses: ./.github/actions/deploy
        with:
          stage: pr-${{ github.event.pull_request.number }}
          doppler-token: ${{ secrets.DOPPLER_TOKEN_DEV }}
          e2e: "true"
      - if: ${{ !cancelled() && steps.deploy.outputs.app != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          APP: ${{ steps.deploy.outputs.app }}
          SITE: ${{ steps.deploy.outputs.site }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "### Preview

          | | |
          | --- | --- |
          | App | $APP |
          | Public site | $SITE |
          | Commit | \`${SHA:0:7}\` ([checks]($RUN)) |

          Sign up with a passkey. It has its own empty database, deleted when this PR closes."

  # Prod deploys only from here, after every check passes. The prd token lives in the production environment,
  # which only main can use.
  prod:
    name: Deploy prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/deploy
        with:
          stage: prod
          doppler-token: ${{ secrets.DOPPLER_TOKEN_PRD }}
