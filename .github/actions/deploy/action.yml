name: deploy
description: Deploy one Alchemy stage with Doppler secrets and write what changed to the job summary.
inputs:
  stage:
    description: Alchemy stage, e.g. pr-12 or prod
    required: true
  doppler-token:
    description: Doppler service token for the stage's config (dev for previews, prd for prod)
    required: true
runs:
  using: composite
  steps:
    - uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4
    # The summary is the plan Alchemy prints before applying. Replaced or deleted resources also become
    # warnings, since that is how a rename shows up; in prod, RemovalPolicy.protect fails those plans.
    # --adopt takes over resources under our own pinned names (brainiac-<id>-<stage>) that state doesn't
    # know yet, such as those Alchemy 0.94 made; nothing else on the account uses those names.
    - shell: bash
      env:
        DOPPLER_TOKEN: ${{ inputs.doppler-token }}
        STAGE: ${{ inputs.stage }}
        NO_COLOR: "1"
      run: |
        set -o pipefail
        status=0
        doppler run -- alchemy deploy --stage "$STAGE" --yes --adopt --no-input 2>&1 | tee deploy.log || status=$?
        plan='\] (create|update|replace|delete|adopted)$'
        {
          echo "### Stage \`$STAGE\`"
          echo '```'
          grep -m1 -oE 'Plan: .*' deploy.log || echo "no plan (see the job log)"
          grep -oE "\[[^]]+$plan" deploy.log || true
          echo '```'
          grep -oE "url: '[^']+'" deploy.log || true
        } >> "$GITHUB_STEP_SUMMARY"
        grep -oE '\[[^]]+\] (replace|delete)$' deploy.log | sed 's/^/::warning title=Alchemy::/' || true
        exit $status
