name: Feature
description: Work for one milestone, written as a brief an agent can pick up cold.
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: Write this as a prompt for an agent that has never seen the repo. Link docs instead of copying them.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The problem in one or two sentences, and the doc page it comes from (docs/...).
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What ships
      description: The smallest version that does the job, as a list.
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
      description: What this deliberately doesn't do.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Files and packages to touch or create.
    validations:
      required: true
  - type: input
    id: deps
    attributes:
      label: Depends on
      description: "Issue numbers that must land first, or: nothing."
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable criteria, each with the test, property test or eval case that proves it.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: breaks
    attributes:
      label: How it breaks
      description: Failure modes this must handle (docs/internals/failure-modes.md).
