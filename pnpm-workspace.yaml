packages:
  - apps/*
  - packages/*
  - oxlint-plugin-brainiac
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261114.1"
  - "@effect/tsgo-darwin-arm64@0.69.0"
  - "@effect/tsgo-darwin-x64@0.69.0"
  - "@effect/tsgo-linux-arm64@0.69.0"
  - "@effect/tsgo-linux-arm@0.69.0"
  - "@effect/tsgo-linux-x64@0.69.0"
  - "@effect/tsgo-win32-arm64@0.69.0"
  - "@effect/tsgo-win32-x64@0.69.0"
  - "@effect/tsgo@0.69.0"
allowBuilds:
  bun: true
  esbuild: true
  workerd: true
  sharp: false
# miniflare 4 pins sharp 0.35.2 and undici 7.28.0, which have advisories fixed in these patch versions.
overrides:
  miniflare>sharp: 0.35.5
  miniflare>undici: 7.30.1
patchedDependencies:
  tesseract-wasm@0.11.0: patches/tesseract-wasm@0.11.0.patch
