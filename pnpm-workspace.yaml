packages:
  - apps/*
  - packages/*
  - oxlint-plugin-brainiac
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261114.1"
  - "@effect/tsgo-darwin-arm64@0.69.0"
  - "@effect/tsgo-darwin-x64@0.69.0"
  - "@effect/tsgo-linux-arm64@0.69.0"
  - "@effect/tsgo-linux-arm@0.69.0"
  - "@effect/tsgo-linux-x64@0.69.0"
  - "@effect/tsgo-win32-arm64@0.69.0"
  - "@effect/tsgo-win32-x64@0.69.0"
  - "@effect/tsgo@0.69.0"
allowBuilds:
  bun: true
  esbuild: true
  workerd: true
  sharp: false
# miniflare 4 pins sharp 0.35.2 and undici 7.28.0, which have advisories fixed in these patch versions.
overrides:
  miniflare>sharp: 0.35.5
  miniflare>undici: 7.30.1
patchedDependencies:
  # shortcut: carries resourceSeedScope from better-auth/better-auth#12652 (#83); drop it for the release that ships it.
  "@better-auth/oauth-provider@1.7.22": patches/@better-auth__oauth-provider@1.7.22.patch
  # A Worker can't build code from strings: the fixed functions the Typst compiler builds that way, written out (apps/typst).
  "@myriaddreamin/typst-ts-web-compiler@0.7.0": patches/@myriaddreamin__typst-ts-web-compiler@0.7.0.patch
  tesseract-wasm@0.11.0: patches/tesseract-wasm@0.11.0.patch
