# Open Knowledge Format v0.2 manifest for the fixture record.
schema_version: 1
types:
  Education:
    version: 1
    held: true
    folder: facts/education
    headline: "{degree} · {institution} · {start|year}–{end|year} · CGPA {cgpa|2}"
    key: [institution, degree]
    fields:
      institution: {kind: text, required: true, example: Northvale University}
      degree: {kind: text, required: true, example: BSc Computer Science}
      start: {kind: date}
      end: {kind: date}
      cgpa: {kind: number, example: 3.82}
      scale: {kind: number, example: 4}
      sources: {kind: list}
  TestScore:
    version: 1
    held: true
    folder: facts/tests
    headline: "{test} · {overall|1} · {date} · expires {expires|month}"
    key: [test, date]
    fields:
      test: {values: [ielts-academic, toefl-ibt, gre], required: true}
      overall: {kind: number, required: true, example: 8.0}
      sections: {kind: mapping, example: "{listening: 8.5, reading: 8.0}"}
      date: {kind: date, required: true}
      expires: {kind: date}
      trf_number: {kind: text}
      supersedes: {kind: relation, example: ielts-2025-03.md}
      sources: {kind: list}
      verified: {kind: mapping}
  Role:
    version: 1
    held: true
    folder: facts/roles
    headline: "{title} · {org} · {start|month}–{end|month}"
    key: [org, title, start]
    fields:
      org: {kind: text, required: true, example: Acme Robotics}
      title: {kind: text, required: true, example: Software Engineering Intern}
      kind: {values: [internship, job, research, volunteer]}
      start: {kind: date, required: true}
      end: {kind: date}
  Application:
    version: 1
    folder: applications
    headline: "{title} · {status} · deadline {deadline}"
    fields:
      kind: {values: [university, scholarship, job], required: true}
      deadline: {kind: date, required: true}
      portal: {kind: text, example: "https://campus.tum.de"}
      portal_login: {kind: text, example: "secret:portal.tum"}
      status: {values: [preparing, submitted, decided], required: true}
      requirements: {kind: list}
  Document:
    version: 1
    folder: documents
    headline: "{title} · {kind} · issued {issued}"
    fields:
      kind: {values: [transcript, test-report, certificate, id], required: true}
      issuer: {kind: text}
      issued: {kind: date}
      expires: {kind: date}
      file: {kind: text, example: files/transcript-bsc.pdf}
      proves: {kind: list}
      extracted: {kind: mapping, example: "{cgpa: 3.82, scale: 4}"}
  IdDocument:
    version: 1
    held: true
    folder: identity
    headline: "{kind} · {issuer} · expires {expires}"
    key: [kind, issuer, number]
    fields:
      kind: {values: [passport, national-id, visa], required: true}
      issuer: {kind: text, required: true, example: UTO}
      number: {kind: text, example: "secret:passport.uto.3f2a9c1b07de"}
      surname: {kind: text}
      given_names: {kind: text}
      nationality: {kind: text}
      birth_date: {kind: date}
      sex: {values: [M, F, X]}
      expires: {kind: date}
  Person:
    version: 1
    folder: people
    headline: "{title} · {role} · {org}"
    fields:
      role: {values: [referee, advisor, family], required: true}
      org: {kind: text}
